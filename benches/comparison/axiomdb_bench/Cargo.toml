[package]
name    = "axiomdb-bench-comparison"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "axiomdb_bench"
path = "src/main.rs"

[features]
default = []
# Forwards to axiomdb-sql/bench-timings so --diagnose-insert-deep can read
# the thread-local INSERT phase counters. Enable with:
#   cargo run -p axiomdb-bench-comparison --release --features bench-timings -- ...
bench-timings = ["axiomdb-sql/bench-timings"]

[dependencies]
axiomdb-embedded = { path = "../../../crates/axiomdb-embedded" }
axiomdb-catalog  = { path = "../../../crates/axiomdb-catalog" }
axiomdb-core     = { path = "../../../crates/axiomdb-core" }
axiomdb-sql      = { path = "../../../crates/axiomdb-sql" }
axiomdb-storage  = { path = "../../../crates/axiomdb-storage" }
axiomdb-types    = { path = "../../../crates/axiomdb-types" }
axiomdb-wal      = { path = "../../../crates/axiomdb-wal" }
rusqlite         = { version = "0.32", features = ["bundled"] }
tempfile         = "3"
