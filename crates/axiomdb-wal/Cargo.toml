[package]
name        = "axiomdb-wal"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
axiomdb-core    = { workspace = true }
axiomdb-storage = { workspace = true }
thiserror       = { workspace = true }
tracing         = { workspace = true }
crc32c          = "0.6"
tokio           = { workspace = true, features = ["sync"] }
libc            = "0.2"

[dev-dependencies]
# Enable axiomdb-storage's `testing` feature for tests/benches so crash tests can
# use FaultInjectionStorage (power-loss simulation). Release builds are unaffected.
axiomdb-storage = { workspace = true, features = ["testing"] }
tempfile  = { workspace = true }
criterion = { workspace = true }

[[bench]]
name    = "wal_writer"
harness = false
