[package]
name        = "axiomdb-sql"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
# All optional features on by default so existing users of axiomdb-sql
# (axiomdb-cli, axiomdb-network, axiomdb-server) keep full functionality.
# The embedded crate uses `default-features = false` + explicit opt-in to
# build a minimal library without these heavy deps.
default = ["import-export", "xml", "regexp", "crypto-fns"]

# COPY FROM/TO CSV and COPY FROM/TO PARQUET support.
# Pulls in: parquet (~1.5 MB) + csv (~200 KB).
import-export = ["dep:parquet", "dep:csv"]

# XMLTABLE() table-valued function and XML scalar functions.
# Pulls in: roxmltree (~100 KB).
xml = ["dep:roxmltree"]

# REGEXP / REGEXP_LIKE / REGEXP_REPLACE operators and JSON Schema
# `pattern` / `patternProperties` validation.
# Pulls in: regex (~400 KB).
regexp = ["dep:regex"]

# MD5 / SHA1 / SHA224 / SHA256 / SHA384 / SHA512 SQL hash functions.
# Pulls in: md-5 + sha1 + sha2 (~300 KB total).
crypto-fns = ["dep:md-5", "dep:sha1", "dep:sha2"]

# Enables thread-local timing accumulators in the INSERT path for the
# `axiomdb_bench --diagnose-insert-deep` diagnostic. ZERO cost when disabled.
bench-timings = []
# Phase 24.4b: ICU4X-backed locale-aware collations
# (Turkish-i, German-ß, language-aware sort, accent-sensitive
# variants, etc.). Adds ~500 KB-1 MB to the binary depending on
# locale data baked in. Disabled by default to keep the embedded
# library lightweight — users that need locale-specific behaviour
# opt in.
icu-collations = ["dep:icu_collator", "dep:icu_locale"]

[dependencies]
axiomdb-core    = { workspace = true }
axiomdb-types   = { workspace = true }
axiomdb-catalog = { workspace = true }
axiomdb-index   = { workspace = true }
axiomdb-storage = { workspace = true }
axiomdb-wal     = { workspace = true }
axiomdb-lock    = { workspace = true }
thiserror       = { workspace = true }
logos           = { workspace = true }
rand            = { workspace = true }
bloomfilter     = { workspace = true }
bytemuck        = { workspace = true }
wide            = { workspace = true }
rayon           = { workspace = true }
lz4_flex        = { workspace = true }
serde_json      = { workspace = true }
csv             = { workspace = true, optional = true }
hashbrown       = { workspace = true }
url             = { workspace = true }
tempfile        = { workspace = true }
chrono                = { version = "0.4", default-features = false, features = ["std"] }
unicode-normalization = "0.1"
# Phase 24.4b: optional ICU4X collator (compiled_data = bundled
# pre-built Unicode tables). Gated by the `icu-collations` feature
# so default builds stay lean.
icu_collator         = { version = "2.2", optional = true, default-features = false, features = ["compiled_data"] }
icu_locale           = { version = "2.0", optional = true }
regex                 = { workspace = true, optional = true }
parquet               = { version = "54", default-features = false, features = ["snap"], optional = true }
roxmltree             = { workspace = true, optional = true }
rust_decimal          = { version = "1", default-features = false, features = ["maths"] }
# Phase 24.5: cryptographic hashes for MD5/SHA-1/SHA-2 SQL functions.
md-5                  = { version = "0.10", default-features = false, optional = true }
sha1                  = { version = "0.10", default-features = false, optional = true }
sha2                  = { version = "0.10", default-features = false, optional = true }

[dev-dependencies]
criterion    = { workspace = true }
sqlparser    = "0.53"
tempfile     = { workspace = true }
rusqlite     = { version = "0.32", features = ["bundled"] }

[[bench]]
name    = "sql_components"
harness = false

[[bench]]
name    = "parser_comparison"
harness = false

[[bench]]
name    = "executor_e2e"
harness = false

[[bench]]
name    = "sqlite_comparison"
harness = false

[[bench]]
name    = "fts"
harness = false
